[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-archive-bot"
version = "0.1.0"
description = "Local learning personal Discord archive"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.4,<3"]

[project.optional-dependencies]
documents = ["pypdf>=5,<7", "Pillow>=10,<13", "pytesseract>=0.3.13,<1"]

[project.scripts]
discord-archive = "discord_archive.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
